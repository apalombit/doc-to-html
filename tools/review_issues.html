<title>L2 Review Issues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* One issue on the desk at a time: the page and our render side by side,
   then what each side says, then the decision. Red marks the spot on the
   pictures; green and red buttons only ever mean agree and disagree. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunk: #eaeef3; --ink: #17202a; --muted: #5a6573;
  --line: #d6dce4; --accent: #2b59c3; --accent-soft: #e3eafb;
  --agree: #1d7a4c; --agree-soft: #e2f3ea; --disagree: #b42a22; --disagree-soft: #fbe6e4;
  --unsure: #876a12; --unsure-soft: #f6efd8;
  --shadow: 0 1px 2px rgba(23, 32, 42, .06);
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #151c24; --sunk: #1b232d; --ink: #e5eaf0; --muted: #9aa5b1;
  --line: #2a3542; --accent: #82a6ff; --accent-soft: #1d2a47;
  --agree: #5fc995; --agree-soft: #153325; --disagree: #ff7a70; --disagree-soft: #3a1b19;
  --unsure: #e5c158; --unsure-soft: #352c12; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --sunk: #1b232d; --ink: #e5eaf0; --muted: #9aa5b1;
  --line: #2a3542; --accent: #82a6ff; --accent-soft: #1d2a47;
  --agree: #5fc995; --agree-soft: #153325; --disagree: #ff7a70; --disagree-soft: #3a1b19;
  --unsure: #e5c158; --unsure-soft: #352c12; --shadow: none; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); padding: 0 16px 48px; margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.55rem; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin-inline: auto; }
.eyebrow { font: 500 .72rem/1 var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

header.top { padding: 28px 0 16px; display: grid; gap: 8px; }
header.top p { color: var(--muted); max-width: 70ch; }
.banner { border: 2px solid var(--disagree); background: var(--disagree-soft); border-radius: 8px; padding: 10px 14px; margin-top: 8px; }
.banner[hidden] { display: none; }
.banner a { color: var(--accent); }

.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 0; position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
.steps button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font: 600 .95rem var(--mono); }
.steps button[aria-current="step"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.steps button.v-agree { background: var(--agree); border-color: var(--agree); color: var(--surface); }
.steps button.v-disagree { background: var(--disagree); border-color: var(--disagree); color: var(--surface); }
.steps button.v-unsure { background: var(--unsure); border-color: var(--unsure); color: var(--surface); }
.steps .count { margin-left: auto; font-size: .9rem; color: var(--muted); }
.steps .status { font-size: .82rem; color: var(--muted); }
.steps .status.warn { color: var(--disagree); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-top: 20px; overflow: hidden; }
.card > .head { padding: 20px 24px 12px; display: grid; gap: 8px; }
.kind { justify-self: start; font: 500 .74rem/1 var(--mono); text-transform: uppercase; letter-spacing: .07em; padding: 5px 8px; border-radius: 4px; }
.kind.missed, .kind.added { background: var(--disagree-soft); color: var(--disagree); }
.kind.false { background: var(--accent-soft); color: var(--accent); }
.kind.followup, .kind.criteria, .kind.rule { background: var(--unsure-soft); color: var(--unsure); }
.kind.spot { background: var(--agree-soft); color: var(--agree); }
.rounds { display: flex; flex-wrap: wrap; gap: 4px; }
.rounds button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: .9rem; }
.rounds button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.what { font-size: 1.05rem; max-width: 75ch; }

.pics { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 8px 24px 20px; align-items: start; }
.pics.wide { grid-template-columns: minmax(0, 1fr); }
figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
figcaption { font: 500 .78rem var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
figure img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 6px; background: #fff; }

.says { display: grid; grid-template-columns: 11rem minmax(0, 1fr); border-top: 1px solid var(--line); }
.says > dt, .says > dd { margin: 0; padding: 12px 24px; border-bottom: 1px solid var(--line); }
.says > dt { font: 600 .95rem var(--display); color: var(--muted); padding-right: 0; }
.says > dd.proposes { font-weight: 600; background: var(--accent-soft); }
.says > dt.proposes { background: var(--accent-soft); color: var(--accent); }

.decide { padding: 18px 24px 22px; display: grid; gap: 12px; }
.decide .q { font: 600 1.1rem var(--display); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { border: 2px solid currentColor; background: var(--surface); padding: 10px 18px; border-radius: 8px; font-weight: 600; min-height: 44px; }
.choices [data-v="agree"] { color: var(--agree); }
.choices [data-v="disagree"] { color: var(--disagree); }
.choices [data-v="unsure"] { color: var(--unsure); }
.choices [data-v="agree"][aria-pressed="true"] { background: var(--agree); border-color: var(--agree); color: var(--surface); }
.choices [data-v="disagree"][aria-pressed="true"] { background: var(--disagree); border-color: var(--disagree); color: var(--surface); }
.choices [data-v="unsure"][aria-pressed="true"] { background: var(--unsure); border-color: var(--unsure); color: var(--surface); }
.choices button:disabled { opacity: .5; cursor: not-allowed; }
textarea { width: 100%; min-height: 3.2rem; resize: vertical; font: .95rem/1.45 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.saved { font-size: .8rem; color: var(--muted); min-height: 1.2em; }

.nav { display: flex; justify-content: space-between; gap: 8px; padding: 0 24px 22px; }
.nav button { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 10px 16px; font-weight: 500; min-height: 44px; }
.nav button.next { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.nav button:disabled { opacity: .4; cursor: default; }

@media (max-width: 720px) {
  .pics { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; }
  .says { grid-template-columns: minmax(0, 1fr); }
  .says > dt { padding-bottom: 0; border-bottom: 0; padding-inline: 16px; }
  .says > dd { padding-inline: 16px; }
  .card > .head, .decide, .nav { padding-inline: 16px; }
}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">Spec 0021 · step 6 · the review's questions</span>
    <div class="rounds" id="rounds" role="group" aria-label="Rounds"></div>
    <h1 id="round-title"></h1>
    <p id="round-intro"></p>
    <p class="banner" id="banner" hidden></p>
  </header>

  <nav class="steps" id="steps" aria-label="Issues">
    <span class="count" id="count"></span>
    <span class="status" id="status" role="status"></span>
  </nav>

  <article class="card" id="card" aria-live="polite">
    <div class="head">
      <span class="eyebrow" id="pos"></span>
      <span class="kind" id="kind"></span>
      <h2 id="title"></h2>
      <p class="what" id="what"></p>
    </div>
    <div class="pics" id="pics">
      <figure><figcaption>The page</figcaption><img id="img-source" alt=""></figure>
      <figure><figcaption>Our render</figcaption><img id="img-render" alt=""></figure>
    </div>
    <dl class="says">
      <dt>The checks say</dt><dd id="checks"></dd>
      <dt>Claude says</dt><dd id="claude"></dd>
      <dt>How often</dt><dd id="often"></dd>
      <dt class="proposes">Claude proposes</dt><dd class="proposes" id="proposes"></dd>
    </dl>
    <div class="decide">
      <p class="q">Your decision on Claude's proposal</p>
      <textarea id="note" placeholder="Optional, before you click: why, or what to do instead" aria-label="Your note on this issue"></textarea>
      <div class="choices" role="group" aria-label="Your decision">
        <button type="button" data-v="agree" aria-pressed="false">✓ Agree, do it</button>
        <button type="button" data-v="disagree" aria-pressed="false">✗ Disagree</button>
        <button type="button" data-v="unsure" aria-pressed="false">? Not sure</button>
      </div>
      <span class="saved" id="saved"></span>
    </div>
    <div class="nav">
      <button type="button" id="prev">← Previous</button>
      <button type="button" class="next" id="next">Next issue →</button>
    </div>
  </article>
</div>

<script type="application/json" id="data">/*DATA*/</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const ROUNDS = DATA.rounds;
  let round = ROUNDS.length - 1;
  let ISSUES = ROUNDS[round].issues;
  const $ = (s) => document.querySelector(s);
  const KIND = { missed: "Missed by the checks", false: "False alarm by the checks", followup: "Your round 1 call",
                 criteria: "A question the criteria leave open", spot: "Spot check of Claude's call", rule: "Testing your alignment line", added: "A fault Claude added" };
  const HERE = "https://claude.ai/artifact/RpUd3a7ioGjdNWBLyqM6JD";
  const decisions = new Map();   // key -> {verdict, note}
  const pending = new Set();     // keys decided before the store answered
  let db = null, uid = null, writable = true, ready = false, offline = false;
  let at = 0;

  const status = $("#status"), banner = $("#banner");
  const say = (text, warn = false) => { status.textContent = text; status.classList.toggle("warn", warn); };
  function warnOffline() {
    offline = true;
    banner.replaceChildren(document.createTextNode("Saving is off in this view, so your decisions are not kept. Open "),
      Object.assign(document.createElement("a"), { href: HERE, target: "_blank", rel: "noopener", textContent: "the page on claude.ai" }),
      document.createTextNode(", signed in, to record them."));
    banner.hidden = false;
    say("Not saving.", true);
  }

  // ---- the rounds and the steps ----------------------------------------------
  const steps = $("#steps"), count = $("#count"), roundsEl = $("#rounds");
  let dots = [];
  const roundButtons = ROUNDS.map((r, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = r.name;
    b.addEventListener("click", () => openRound(i, 0));
    roundsEl.append(b);
    return b;
  });
  function openRound(r, i) {
    round = r; ISSUES = ROUNDS[r].issues;
    roundButtons.forEach((b, k) => b.setAttribute("aria-pressed", String(k === r)));
    $("#round-title").textContent = ROUNDS[r].title;
    $("#round-intro").textContent = ROUNDS[r].intro;
    for (const d of dots) d.remove();
    dots = ISSUES.map((issue, k) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = String(k + 1);
      b.setAttribute("aria-label", `Issue ${k + 1}: ${issue.title}`);
      b.addEventListener("click", () => show(k));
      steps.insertBefore(b, count);
      return b;
    });
    show(i);
  }
  function paintSteps() {
    let done = 0;
    ISSUES.forEach((issue, i) => {
      const v = decisions.get(issue.key)?.verdict;
      if (v) done++;
      dots[i].className = v ? `v-${v}` : "";
      if (i === at) dots[i].setAttribute("aria-current", "step"); else dots[i].removeAttribute("aria-current");
    });
    count.textContent = done === ISSUES.length ? `All ${done} decided: tell Claude` : `${done} of ${ISSUES.length} decided`;
  }

  // ---- one issue --------------------------------------------------------------
  const choices = [...document.querySelectorAll(".choices button")];
  const note = $("#note"), saved = $("#saved");
  function show(i) {
    at = Math.max(0, Math.min(ISSUES.length - 1, i));
    const issue = ISSUES[at];
    $("#pos").textContent = `Issue ${at + 1} of ${ISSUES.length} · ${issue.page}`;
    const kind = $("#kind"); kind.textContent = KIND[issue.kind]; kind.className = `kind ${issue.kind}`;
    $("#title").textContent = issue.title;
    $("#what").textContent = issue.what;
    // a wide, short crop reads better full width, the page above our render
    const [l, t, r, b] = issue.source_crop;
    $("#pics").classList.toggle("wide", (r - l) / (b - t) > 2.4);
    const src = $("#img-source"), ren = $("#img-render");
    src.src = issue.source_img; src.alt = `The page ${issue.page}, the spot marked in red`;
    ren.src = issue.render_img; ren.alt = `Our render of ${issue.page}, the spot marked in red`;
    $("#checks").textContent = issue.checks;
    $("#claude").textContent = issue.claude;
    $("#often").textContent = issue.often;
    $("#proposes").textContent = issue.proposes;
    paintChoice();
    saved.textContent = "";
    $("#prev").disabled = at === 0;
    $("#next").textContent = at === ISSUES.length - 1 ? "Back to issue 1" : "Next issue →";
    paintSteps();
    try { history.replaceState(null, "", `#r${round + 1}-${at + 1}`); } catch (e) {}
    try { localStorage.setItem("l2-issues-at", `${round}:${at}`); } catch (e) {}
  }
  function paintChoice() {
    const d = decisions.get(ISSUES[at].key) || {};
    for (const b of choices) b.setAttribute("aria-pressed", String(d.verdict === b.dataset.v));
    if (document.activeElement !== note) note.value = d.note ?? "";
  }
  $("#prev").addEventListener("click", () => { show(at - 1); window.scrollTo({ top: 0 }); });
  $("#next").addEventListener("click", () => { show(at === ISSUES.length - 1 ? 0 : at + 1); window.scrollTo({ top: 0 }); });
  document.addEventListener("keydown", (e) => {
    if (e.target === note) return;
    if (e.key === "ArrowRight") show(at + 1);
    else if (e.key === "ArrowLeft") show(at - 1);
  });

  // ---- deciding and saving: one write at a time per issue ---------------------
  const chains = new Map();
  let timer = null;
  const keepNote = () => { const key = ISSUES[at].key; if ((decisions.get(key)?.note ?? "") !== note.value) save(key, { note: note.value }); };
  function save(key, patch) {
    if (!writable) { say("This view can read the decisions but not save them.", true); return; }
    const next = { ...(decisions.get(key) || {}), ...patch };
    decisions.set(key, next); paintSteps(); paintChoice();
    if (offline) { warnOffline(); return; }
    if (!ready) { pending.add(key); say("Connecting… your decisions will save as soon as the store answers."); return; }
    write(key, next);
  }
  function write(key, d) {
    const r = ROUNDS.find((x) => x.issues.some((i) => i.key === key));
    const issue = r.issues.find((x) => x.key === key);
    const body = { key, round: r.name, title: issue.title, page: issue.page, kind: issue.kind, verdict: d.verdict ?? null,
                   note: d.note ?? "", by: uid, at: new Date().toISOString() };
    const ref = db.collection("issues").doc(key);
    const run = (chains.get(key) || Promise.resolve()).then(async () => {
      try { await ref.set(body); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise((r) => setTimeout(r, 600 + Math.random() * 900)); await ref.set(body); }
        else throw e;
      }
    }).then(() => {
      if (ISSUES[at].key === key) saved.textContent = "Saved";
      say("All decisions saved.");
    }).catch((e) => {
      if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) {
        writable = false; lock();
        banner.textContent = "This view can read the decisions but not save them."; banner.hidden = false;
      } else if (e && e.code === "quota_exceeded") say("The store is full; tell Claude.", true);
      else say("A decision did not save. Click it again in a moment.", true);
    });
    chains.set(key, run);
  }
  function lock() { for (const b of choices) b.disabled = true; note.readOnly = true; }
  // a decision moves on by itself, to the next issue not decided yet
  let moving = null;
  function advance() {
    for (let k = 1; k <= ISSUES.length; k++) {
      const i = (at + k) % ISSUES.length;
      if (!decisions.get(ISSUES[i].key)?.verdict) { show(i); window.scrollTo({ top: 0 }); return; }
    }
    if (at < ISSUES.length - 1) { show(at + 1); window.scrollTo({ top: 0 }); }
  }
  for (const b of choices) b.addEventListener("click", () => {
    clearTimeout(timer); keepNote();
    const key = ISSUES[at].key, cur = decisions.get(key)?.verdict;
    const verdict = cur === b.dataset.v ? null : b.dataset.v;
    save(key, { verdict });
    clearTimeout(moving);
    if (verdict && writable) moving = setTimeout(advance, 350);
  });
  note.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(keepNote, 900); });
  note.addEventListener("blur", () => { clearTimeout(timer); keepNote(); });

  // ---- first paint, then the store --------------------------------------------
  // the latest round opens, at the issue last seen there
  let start = 0;
  const hash = /^#r(\d+)-(\d+)$/.exec(location.hash);
  if (hash && +hash[1] === ROUNDS.length && +hash[2] >= 1 && +hash[2] <= ISSUES.length) start = +hash[2] - 1;
  else { try { const [r, i] = (localStorage.getItem("l2-issues-at") || "").split(":").map(Number); if (r === round && i >= 0 && i < ISSUES.length) start = i; } catch (e) {} }
  openRound(round, start);

  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { warnOffline(); return; }
    const [store, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!store) { warnOffline(); return; }
    db = store;
    if (user) {
      uid = await user.id();
      if (await user.can("data.write") === false) {
        writable = false; lock();
        banner.textContent = "You can read the decisions here but not change them."; banner.hidden = false;
      }
    }
    let loaded = false;
    const slow = setTimeout(() => { if (!loaded) say("The saved decisions can't be reached yet; they will appear when the store answers.", true); }, 10000);
    db.collection("issues").onSnapshot((snap) => {
      for (const ch of snap.docChanges()) {
        if (pending.has(ch.doc.id)) continue;
        if (ch.type === "removed") decisions.delete(ch.doc.id);
        else { const d = ch.doc.data() || {}; decisions.set(ch.doc.id, { verdict: d.verdict ?? null, note: d.note ?? "" }); }
      }
      paintSteps(); paintChoice();
      if (!snap.metadata.fromCache && !loaded) {
        loaded = true; ready = true; clearTimeout(slow);
        if (writable) {
          say(snap.size ? `${snap.size} decisions loaded.` : "");
          for (const key of pending) write(key, decisions.get(key));
          pending.clear();
        }
      }
    }, (e) => {
      clearTimeout(slow);
      say(e && e.code === "revoked" ? "Saved decisions are no longer available in this view." : "The saved decisions stopped updating. Reload the page.", true);
    });
  })();
})();
</script>
