[project]
name = "doc-to-html"
version = "0.1.0"
description = "Turns a photograph of a text-bearing document into structural HTML"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "ollama>=0.4",
    "pydantic>=2.9",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.13"]
# Trained layout detectors, run as ONNX on the CPU. Optional because the base
# install must stay importable without a model download, and because this is
# still a bakeoff: `tools/detector_probe.py` decides whether either candidate
# earns a place before anything in `src/` depends on it.
detector = ["onnxruntime>=1.20"]
dev = ["pytest>=8.0", "mypy>=1.11"]
# Building the corpus's real PDF pages (spec 0020 §P): pypdfium2 renders a page
# (Apache-2.0 / BSD-3), pdfplumber reads its text layer with positions (MIT).
# Not PyMuPDF, which is AGPL. Nothing in `src/` imports either.
corpus = [
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.14.0",
]

[project.scripts]
doc-to-html = "doc_to_html.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_to_html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/doc_to_html"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# None ships type information; each is reached only through a narrow seam.
module = ["cv2.*", "ollama.*", "onnxruntime.*", "pypdfium2.*", "pdfplumber.*"]
ignore_missing_imports = true
