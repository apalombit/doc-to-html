[project]
name = "doc-to-html"
version = "0.1.0"
description = "Turns a photograph of a text-bearing document into structural HTML"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "ollama>=0.4",
    "pydantic>=2.9",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.13"]
dev = ["pytest>=8.0"]

[project.scripts]
doc-to-html = "doc_to_html.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_to_html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
